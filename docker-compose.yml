services:
  # Postgres with pgvector extension
  db-postgres:
    image: pgvector/pgvector:pg17
    container_name: aris-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aris_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aris_password_local}
      POSTGRES_DB: ${POSTGRES_DB:-aris_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - aris-network

  # Neo4j Graph Database
  db-neo4j:
    image: neo4j:5.18.0
    container_name: aris-neo4j
    restart: always
    ports:
      - "7474:7474" # HTTP Console
      - "7687:7687" # Bolt Protocol
    environment:
      NEO4J_AUTH: neo4j/aris_password_local
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - aris-network

  # ARIS Backend API
  aris-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aris-api
    restart: always
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=db-postgres;Database=aris_db;Username=aris_admin;Password=aris_password_local
      - Neo4j__Uri=bolt://db-neo4j:7687
      - Neo4j__User=neo4j
      - Neo4j__Password=aris_password_local
      # Point to the native Windows Ollama instance
      - Ollama__Uri=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - db-postgres
      - db-neo4j
    networks:
      - aris-network

  # ARIS Frontend Web
  aris-web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_CLERK_PUBLISHABLE_KEY=${VITE_CLERK_PUBLISHABLE_KEY:-pk_test_dHJ1c3R5LWNhbGYtNTcuY2xlcmsuYWNjb3VudHMuZGV2JA}
    container_name: aris-web
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - aris-api
    networks:
      - aris-network

networks:
  aris-network:
    driver: bridge

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
