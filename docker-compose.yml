services:
  db-postgres:
    image: pgvector/pgvector:pg17
    container_name: aris-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aris_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aris_password_local}
      POSTGRES_DB: ${POSTGRES_DB:-aris_db}
    command: >
      postgres
      -c shared_buffers=2GB
      -c work_mem=64MB
      -c maintenance_work_mem=512MB
      -c effective_cache_size=6GB
      -c random_page_cost=1.1
      -c max_parallel_workers_per_gather=4
      -c max_worker_processes=8
      -c wal_buffers=64MB
      -c checkpoint_completion_target=0.9
      -c default_statistics_target=100
      -c max_connections=50
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        reservations:
          cpus: '2'
          memory: 4G
    networks:
      - aris-network

  db-neo4j:
    image: neo4j:5.18.0
    container_name: aris-neo4j
    restart: always
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/aris_password_local
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      NEO4J_dbms_memory_heap_initial__size: 2G
      NEO4J_dbms_memory_heap_max__size: 4G
      NEO4J_dbms_memory_pagecache_size: 2G
      NEO4J_dbms_transaction_timeout: 60s
      NEO4J_dbms_jvm_additional: >-
        -XX:+UseG1GC
        -XX:+ParallelRefProcEnabled
        -XX:MaxGCPauseMillis=200
        -XX:InitiatingHeapOccupancyPercent=45
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    deploy:
      resources:
        reservations:
          cpus: '2'
          memory: 6G
    networks:
      - aris-network

  aris-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aris-api
    restart: always
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=db-postgres;Database=aris_db;Username=aris_admin;Password=aris_password_local;Maximum Pool Size=20;Minimum Pool Size=5;Connection Idle Lifetime=300
      - Neo4j__Uri=bolt://db-neo4j:7687
      - Neo4j__User=neo4j
      - Neo4j__Password=aris_password_local
      - Ollama__Uri=${OLLAMA_HOST_URL:-http://host.docker.internal:11434}
      - DOTNET_GCHeapHardLimit=0x100000000
      - DOTNET_ReadyToRun=1
      - COMPlus_TieredCompilation=1
      - Clerk__Authority=${CLERK_AUTHORITY}
      - Clerk__SecretKey=${CLERK_SECRET_KEY}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - db-postgres
      - db-neo4j
    deploy:
      resources:
        reservations:
          memory: 2G
    networks:
      - aris-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: aris-pgadmin
    restart: always
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@aris.dev
      PGADMIN_DEFAULT_PASSWORD: aris_password_local
    depends_on:
      - db-postgres
    networks:
      - aris-network

  # ARIS Frontend Web
  aris-web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_CLERK_PUBLISHABLE_KEY=${VITE_CLERK_PUBLISHABLE_KEY:-pk_test_dHJ1c3R5LWNhbGYtNTcuY2xlcmsuYWNjb3VudHMuZGV2JA}
    container_name: aris-web
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - aris-api
    networks:
      - aris-network

networks:
  aris-network:
    driver: bridge

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
