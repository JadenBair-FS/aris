services:
  # Postgres with pgvector extension
  db-postgres:
    image: pgvector/pgvector:pg17
    container_name: aris-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aris_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aris_password_local}
      POSTGRES_DB: ${POSTGRES_DB:-aris_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - aris-network

  # Neo4j Graph Database
  db-neo4j:
    image: neo4j:5.18.0
    container_name: aris-neo4j
    restart: always
    ports:
      - "7474:7474" # HTTP Console
      - "7687:7687" # Bolt Protocol
    environment:
      NEO4J_AUTH: neo4j/aris_password_local
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - aris-network

  # llama.cpp Service 1: Mistral (Primary Inference)
  llama-mistral:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: aris-llama-mistral
    restart: always
    ports:
      - "11434:8080"
    volumes:
      - ./models:/models
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    command: >
      -m /models/mistral-7b-instruct-v0.3.Q4_K_M.gguf 
      --host 0.0.0.0 
      --port 8080 
      -ngl 99 
      -fa
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - aris-network

  # llama.cpp Service 2: Qwen3 Embedding (Secondary Inference)
  llama-qwen:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: aris-llama-qwen
    restart: always
    ports:
      - "11435:8080"
    volumes:
      - ./models:/models
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    command: >
      -m /models/qwen3-embedding-0.6b-f16.gguf 
      --host 0.0.0.0 
      --port 8080 
      -ngl 99 
      --embedding 
      --pooling last
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - aris-network

  # ARIS Backend API
  aris-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aris-api
    restart: always
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=db-postgres;Database=aris_db;Username=aris_admin;Password=aris_password_local
      - Neo4j__Uri=bolt://db-neo4j:7687
      - Neo4j__User=neo4j
      - Neo4j__Password=aris_password_local
      # Map to internal docker DNS
      - LlamaCpp__MistralUri=http://llama-mistral:8080/v1
      - LlamaCpp__QwenUri=http://llama-qwen:8080/v1
    depends_on:
      - db-postgres
      - db-neo4j
      - llama-mistral
      - llama-qwen
    networks:
      - aris-network

  # ARIS Frontend Web
  aris-web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_CLERK_PUBLISHABLE_KEY=${VITE_CLERK_PUBLISHABLE_KEY:-pk_test_dHJ1c3R5LWNhbGYtNTcuY2xlcmsuYWNjb3VudHMuZGV2JA}
    container_name: aris-web
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - aris-api
    networks:
      - aris-network

networks:
  aris-network:
    driver: bridge

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
